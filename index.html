<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Personality Test</title>
    <style>
        :root { --primary: #6366F1; --primary-light: #A5B4FC; --bg: #F8FAFC; --card-bg: #FFFFFF; --text: #334155; --bar-bg: #E2E8F0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        #app { background: var(--card-bg); width: 100%; max-width: 580px; padding: 35px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; }
        h1 { font-size: 24px; margin-bottom: 12px; color: #0F172A; text-align: center; }
        p.desc { color: #64748B; margin-bottom: 25px; line-height: 1.7; font-size: 15px; text-align: center; }
        
        .progress-container { width: 100%; background: var(--bar-bg); border-radius: 10px; height: 8px; margin-bottom: 25px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
        
        .option-btn { display: block; width: 100%; padding: 18px 20px; margin-bottom: 15px; background: var(--card-bg); border: 2px solid var(--bar-bg); border-radius: 14px; font-size: 16px; color: var(--text); cursor: pointer; transition: all 0.2s ease; text-align: left; line-height: 1.5; }
        .option-btn:hover { border-color: var(--primary); background: #EEF2FF; transform: translateY(-2px); }
        .lang-btn { text-align: center; font-size: 18px; font-weight: bold; }
        
        .result-header { text-align: center; margin-bottom: 20px; }
        .result-title { color: var(--primary); font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .result-tag { font-weight: bold; font-size: 16px; color: #10B981; margin-bottom: 20px; }
        .result-box { text-align: left; background: #F8FAFC; padding: 20px; border-radius: 16px; margin-bottom: 15px; font-size: 14px; line-height: 1.7; border: 1px solid #E2E8F0; }
        .result-box.guide { background: #ECFDF5; border-color: #A7F3D0; color: #065F46; }
        .result-box strong { display: inline-block; margin-bottom: 6px; font-size: 16px; }
        
        /* 比例图表样式 */
        .score-row { margin-bottom: 15px; }
        .score-row:last-child { margin-bottom: 0; }
        .score-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569;}
        .score-bar-bg { width: 100%; height: 14px; background: #CBD5E1; border-radius: 8px; overflow: hidden; display: flex; }
        .score-bar-fill-l { height: 100%; background: var(--primary); transition: width 1s ease-out; }
        .score-bar-fill-r { height: 100%; background: #94A3B8; transition: width 1s ease-out; }

        .match-box { background: #F1F5F9; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; text-align: left; margin-bottom: 15px;}
        .match-best { border-left: 4px solid #F59E0B; }
        .match-learn { border-left: 4px solid #3B82F6; }
        .match-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; display: block;}
        
        #action-btn { background: var(--primary); color: white; border: none; padding: 16px 28px; border-radius: 14px; cursor: pointer; margin-top: 10px; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.2s; }
        #action-btn:hover { background: #4F46E5; }
    </style>
</head>
<body>

            enfj: { name: "ENFJ 主人公", tag: "【充满激情的引导者】", pros: "天生的人际交往专家，极具亲和力。你真诚地关心他人，热心地帮助大家共同成长，是团队的灵魂。", cons: "常常把别人的需求置于自己之上。学会划定界限，接受自己不需要讨好所有人，偶尔的自私是最好的保护。", best: "INFP 调停者：只有他们能敏锐地察觉到你照顾所有人之后的疲惫。", learn: "ISTP 鉴赏家：学习他们“关我什么事”的边界感和独立精神。" },

            istj: { name: "ISTJ 物流师", tag: "【稳如泰山的守护者】", pros: "极度负责，踏实可靠。只要交到你手里的任务，都能有条不紊、高质量地完成，是秩序的基石。", cons: "习惯了既定的规则，会对未知的变化感到不安。试着偶尔跳出舒适区，接纳一点生活中的随机性。", best: "ESTP 企业家：他们能带你体验你从不敢尝试的新鲜与刺激。", learn: "ENFP 竞选者：学习他们拥抱变化、天马行空的想象力。" },
            isfj: { name: "ISFJ 守卫者", tag: "【细心体贴的照顾者】", pros: "极其细心且富有同情心。能记住身边人的每一个小喜好，用实际行动传递着最深沉的安全感。", cons: "太过习惯于默默付出，常常忽略了自己的需求。请学会大声说出你的渴望，你的善良也需要带点锋芒。", best: "ESFP 表演者：他们能带你走出奉献的怪圈，尽情享受当下的快乐。", learn: "ENTP 辩论家：学习他们敢于打破陈规、不惧世俗眼光的勇气。" },
            estj: { name: "ESTJ 总经理", tag: "【高效的实干家】", pros: "务实、果断，极具管理天赋。能迅速建立高效的系统，是能够带领大家稳扎稳打拿到结果的人。", cons: "在注重效率的同时，有时可能会忽略人情味。多给身边的人一些耐心和鼓励，学会倾听不同的声音。", best: "ISTP 鉴赏家：沟通成本极低、执行力极强的完美工作搭档。", learn: "INFP 调停者：学习他们深沉的情感感知力，变得更有人情味。" },
            esfj: { name: "ESFJ 执政官", tag: "【热心肠的连接者】", pros: "热情好客，极具责任心。你是人际网络中的核心枢纽，乐于助人，让身边的每一个人都感到温暖。", cons: "过于渴望得到他人的认可而患得患失。建立更强大的内在自信，你的价值不取决于别人的赞美，你本身就很棒。", best: "ISFP 探险家：他们安静且包容的性格能让你彻底卸下社交伪装。", learn: "INTJ 建筑师：学习他们“不管别人怎么想”的绝对理性与独立。" },
            istp: { name: "ISTP 鉴赏家", tag: "【冷静的解题高手】", pros: "动手能力极强，遇事冷静务实。能在危机中保持清醒，迅速找到最有效的解决路径，洒脱而自由。", cons: "过于追求个人空间，有时会让关心你的人觉得有距离感。尝试在亲密关系中多一些情感的表达。", best: "ESTJ 总经理：他们能为你提供明确的目标，你只管发挥技术。", learn: "ENFJ 主人公：学习他们如何建立深厚且充满力量的人际羁绊。" },
            isfp: { name: "ISFP 探险家", tag: "【内敛的艺术家】", pros: "拥有极高的审美天赋。你温和、友善，不随波逐流，用心感受生活中的每一个美好，追求真善美。", cons: "面对冲突和压力时容易选择逃避。为了守护你珍视的事物，你需要培养一些面对困难的勇气。", best: "ESFJ 执政官：他们会帮你打理好世俗的一切，让你安心做自己。", learn: "ENTJ 指挥官：学习他们直面困难、遇神杀神的强悍气场。" },
            estp: { name: "ESTP 企业家", tag: "【活力四射的实干派】", pros: "行动力极强，胆大心细。能在复杂的环境中迅速捕捉到机遇，热爱挑战，在现实生活中混得如鱼得水。", cons: "习惯追求眼前的刺激，缺乏对长远未来的深度规划。培养一些耐心和战略眼光，你会飞得更高。", best: "ISTJ 物流师：最稳固的大后方，能帮你规避风险、收拾烂摊子。", learn: "INFJ 提倡者：学习他们透过表象看本质的深刻思想维度。" },
            esfp: { name: "ESFP 表演者", tag: "【闪耀的舞台中心】", pros: "极致的乐天派，充满艺术细胞。只要有你在，空气中都弥漫着快乐的味道。你能够轻松化解尴尬，照亮他人。", cons: "容易被新鲜事物吸引，有时会逃避深刻或严肃的话题。尝试为自己设定一些长期的小目标，让快乐更踏实。", best: "ISFJ 守卫者：最温暖的避风港，无限包容你的任性并照顾你。", learn: "INTP 逻辑学家：学习他们深邃的逻辑思考和耐得住寂寞的定力。" }
        ],
        it: {
            intj: { name: "INTJ Architetto", tag: "[Lo Stratega Riflessivo]", pros: "Hai una grande visione a lungo termine. Cogli l'essenza delle cose e crei soluzioni altamente efficienti.", cons: "A volte ignori le emozioni altrui. Prova ad accogliere i momenti emotivi della vita per trovare un nuovo equilibrio.", best: "ENTP Argomentatore: Le vostre menti brillanti si stimolano a vicenda generando idee uniche.", learn: "ESFJ Console: Il loro calore umano ti insegna a connetterti meglio con le emozioni." },
            intp: { name: "INTP Logico", tag: "[L'Esploratore della Verità]", pros: "Sei molto creativo e curioso. Pensi fuori dagli schemi e offri sempre punti di vista unici e profondi.", cons: "Fai fatica a mettere in pratica le idee. Prova a dividere i grandi obiettivi in piccoli passi quotidiani.", best: "ENTJ Comandante: La loro forza esecutiva trasforma le tue idee geniali in realtà.", learn: "ESFP Intrattenitore: Impara da loro come goderti il momento presente con leggerezza." },
            entj: { name: "ENTJ Comandante", tag: "[Il Leader Nato]", pros: "Hai un grande talento per la leadership. Sai gestire le situazioni complesse e guidare il team verso l'obiettivo.", cons: "Puntando troppo al risultato puoi sembrare impaziente. Ascolta le emozioni del team per essere ancora più carismatico.", best: "INTP Logico: Ti offrono prospettive strategiche e profonde per prendere le decisioni migliori.", learn: "ISFP Avventuriero: Impara il loro senso di pace interiore per allentare la tensione." },
            entp: { name: "ENTP Argomentatore", tag: "[L'Innovatore Brillante]", pros: "Hai una mente velocissima e carismatica. Sai trovare nuove opportunità anche nelle difficoltà, sfidando le convenzioni.", cons: "Hai tanti interessi ma fai fatica a portarli a termine. Coltiva la pazienza: se finisci ciò che inizi, sarai inarrestabile.", best: "INFJ Sostenitore: Sono gli unici a comprendere la profondità nascosta dietro la tua energia.", learn: "ISFJ Difensore: Impara a costruire una routine stabile e sicura per la tua vita." },
            infj: { name: "INFJ Sostenitore", tag: "[L'Anima Gemella]", pros: "Hai un'intuizione acuta e profonda empatia. Sei la guida spirituale per molti e sei pronto a sacrificarti per i tuoi ideali.", cons: "Assorbi troppo le emozioni altrui. Ricorda che la tua energia è preziosa, devi prima amare te stesso.", best: "ENFP Attivista: La loro energia solare riesce a curare istantaneamente il tuo stress interiore.", learn: "ESTP Imprenditore: Impara la loro capacità di agire concretamente senza farsi troppi problemi." },
            infp: { name: "INFP Mediatore", tag: "[Il Guaritore Gentile]", pros: "Hai grande empatia e talento artistico. Guardi il mondo con dolcezza, notando la bellezza che sfugge agli altri.", cons: "Tendi a ritirarti nei conflitti. Esprimi coraggiosamente i tuoi veri pensieri: il mondo ha bisogno della tua voce.", best: "ENFJ Protagonista: Accolgono dolcemente la tua sensibilità e ti guidano verso la luce.", learn: "ESTJ Esecutivo: La loro disciplina ti aiuta a trasformare i sogni astratti in realtà tangibili." },
            enfj: { name: "ENFJ Protagonista", tag: "[La Guida Appassionata]", pros: "Sei l'anima del gruppo. Ti prendi cura degli altri sinceramente e li aiuti a crescere con grande carisma.", cons: "Metti i bisogni degli altri prima dei tuoi. Impara a stabilire confini: non devi compiacere tutti per avere valore.", best: "INFP Mediatore: Sanno percepire e curare la stanchezza dietro il tuo sorriso costante.", learn: "ISTP Virtuoso: Impara il loro distacco emotivo per proteggere i tuoi confini personali." },
            enfp: { name: "ENFP Attivista", tag: "[Lo Spirito Libero]", pros: "Sei come un raggio di sole, porti allegria e ispirazione a chi ti circonda, abbracciando infinite possibilità creative.", cons: "Ti distrai facilmente. Impara a scegliere e a mantenere focus quotidiano per far durare i tuoi talenti.", best: "INTJ Architetto: Ti offrono una guida logica e un rifugio sicuro per la tua mente esplosiva.", learn: "ISTJ Logista: Impara la loro costanza nel portare avanti le piccole azioni quotidiane." },
            istj: { name: "ISTJ Logista", tag: "[Il Pilastro Affidabile]", pros: "Estremamente responsabile e concreto. Rispetti gli impegni e porti a termine ogni compito con ordine impeccabile.", cons: "I cambiamenti imprevisti ti spaventano. Prova ad uscire dalla comfort zone e accetta un po' di flessibilità.", best: "ESTP Imprenditore: Ti trascinano in avventure ed esperienze che non oseresti mai fare da solo.", learn: "ENFP Attivista: Impara ad abbracciare l'immaginazione e i cambiamenti con entusiasmo." },
            isfj: { name: "ISFJ Difensore", tag: "[Il Custode Premuroso]", pros: "Molto attento e compassionevole. Ricordi i dettagli di chi ti sta vicino e offri un profondo senso di sicurezza.", cons: "Sei abituato a dare in silenzio e trascuri i tuoi bisogni. Esprimi ciò che desideri, la tua bontà ha bisogno di forza.", best: "ESFP Intrattenitore: Ti aiutano a uscire dal circolo del dovere per goderti la gioia del presente.", learn: "ENTP Argomentatore: Impara il loro coraggio nello sfidare le regole senza curarsi del giudizio altrui." },
            estj: { name: "ESTJ Esecutivo", tag: "[Il Pragmatico Efficiente]", pros: "Deciso e con talento gestionale. Sai mettere ordine nel caos e creare sistemi per raggiungere risultati concreti.", cons: "Puntando all'efficienza, a volte dimentichi il lato umano. Sii più paziente e impara ad ascoltare il team.", best: "ISTP Virtuoso: I partner di lavoro perfetti, comunicazioni essenziali e grande operatività.", learn: "INFP Mediatore: Impara la loro sensibilità emotiva per diventare un leader più umano." },
            esfj: { name: "ESFJ Console", tag: "[Il Connettore Entusiasta]", pros: "Ospitale e responsabile. Sei il cuore della tua rete sociale, sempre pronto ad aiutare e far sentire tutti importanti.", cons: "Desideri troppo l'approvazione esterna. Costruisci una fiducia interiore: il tuo valore non dipende dai complimenti.", best: "ISFP Avventuriero: La loro natura pacifica ti permette di rilassarti senza dover intrattenere nessuno.", learn: "INTJ Architetto: Impara la loro indipendenza e la capacità di pensare freddamente e razionalmente." },
            istp: { name: "ISTP Virtuoso", tag: "[Il Risolutore Calmo]", pros: "Mantieni la calma nelle crisi e trovi subito le soluzioni più efficaci. Sei libero, indipendente e molto pragmatico.", cons: "Cerchi troppo spazio personale, sembrando distante. Esprimi di più i tuoi sentimenti nelle relazioni intime.", best: "ESTJ Esecutivo: Ti forniscono obiettivi chiari e strutture, tu metti la tecnica per risolverli.", learn: "ENFJ Protagonista: Impara come costruire legami interpersonali profondi e carismatici." },
            isfp: { name: "ISFP Avventuriero", tag: "[L'Artista Riservato]", pros: "Hai un grande senso estetico. Sei gentile, non segui la massa e apprezzi ogni piccola bellezza della vita autentica.", cons: "Sotto pressione tendi a fuggire. Per proteggere ciò che ami, coltiva il coraggio di affrontare i problemi.", best: "ESFJ Console: Gestiscono per te le complessità pratiche della vita, lasciandoti libero di essere te stesso.", learn: "ENTJ Comandante: Impara la loro grinta implacabile nell'affrontare gli ostacoli a testa alta." },
            estp: { name: "ESTP Imprenditore", tag: "[Il Dinamico Intraprendente]", pros: "Agisci rapidamente e ami le sfide. Sai cogliere le opportunità e hai un grande carisma per navigare nella realtà.", cons: "Cerchi lo stimolo immediato, mancando di visione a lungo termine. Coltiva il pensiero strategico per volare alto.", best: "ISTJ Logista: Ti coprono le spalle curando i dettagli e minimizzando i rischi delle tue azioni.", learn: "INFJ Sostenitore: Impara a guardare oltre l'apparenza per cogliere significati filosofici e profondi." },
            esfp: { name: "ESFP Intrattenitore", tag: "[La Stella del Palco]", pros: "Un ottimista nato. Porti allegria ovunque tu vada, sei caloroso, generoso e sai come illuminare la vita degli altri.", cons: "Attratto dalle novità, a volte eviti discorsi profondi. Porti piccoli obiettivi renderà la tua felicità più solida.", best: "ISFJ Difensore: Un rifugio sicuro e tollerante che si prende cura di te in ogni momento.", learn: "INTP Logico: Impara la loro capacità di riflessione profonda e di stare bene anche da soli." }
        }
    };

    let app = document.getElementById('app');
    let totalQuestions = 20;

    function renderLanguageSelect() {
        app.innerHTML = `
            <div class="result-header">
                <div style="font-size: 50px; margin-bottom: 10px;">🌍</div>
                <h1 style="font-size: 28px;">Select Language<br>选择你的测试语言</h1>
            </div>
            <button class="option-btn lang-btn" onclick="setLanguage('zh')">🇨🇳 中文</button>
            <button class="option-btn lang-btn" onclick="setLanguage('it')">🇮🇹 Italiano</button>
        `;
    }

    function setLanguage(lang) {
        currentLang = lang;
        renderWelcome();
    }

    function renderWelcome() {
        let ui = uiStr[currentLang];
        app.innerHTML = `
            <div class="result-header">
                <div style="font-size: 55px; margin-bottom: 5px;">🌱</div>
                <h1>${ui.title}</h1>
                <p class="desc">${ui.desc}</p>
            </div>
            <button id="action-btn" onclick="renderQuestion(0)">${ui.startBtn}</button>
        `;
    }

    function renderQuestion(index) {
        if (index >= totalQuestions) {
            calculateResult();
            return;
        }
        
        let progress = (index / totalQuestions) * 100;
        let q = questions[currentLang][index];
        let html = `
            <div class="progress-container" style="display: block;">
                <div class="progress-bar" style="width: ${progress}%"></div>
            </div>
            <h1 style="text-align: left; font-size: 20px;">Q${index + 1}/${totalQuestions}</h1>
            <p class="desc" style="text-align: left; font-size: 16px; color:#334155;">${q.q}</p>
        `;
        
        q.opts.forEach((opt) => {
            html += `<button class="option-btn" onclick="handleAnswer('${opt.type}', ${index})">${opt.text}</button>`;
        });
        app.innerHTML = html;
    }

    function handleAnswer(type, index) {
        scores[type]++;
        renderQuestion(index + 1);
    }

    function calculateResult() {
        let result = "";
        result += scores['E'] >= scores['I'] ? 'e' : 'i';
        result += scores['S'] >= scores['N'] ? 's' : 'n';
        result += scores['T'] >= scores['F'] ? 't' : 'f';
        result += scores['J'] >= scores['P'] ? 'j' : 'p';
        
        showResult(result);
    }

    function buildScoreRow(leftLabel, rightLabel, leftScore, rightScore) {
        let total = 5; // 每组5题
        let pctLeft = Math.round((leftScore / total) * 100);
        let pctRight = 100 - pctLeft;
        return `
            <div class="score-row">
                <div class="score-labels">
                    <span>${leftLabel} (${pctLeft}%)</span>
                    <span>${rightLabel} (${pctRight}%)</span>
                </div>
                <div class="score-bar-bg">
                    <div class="score-bar-fill-l" style="width: ${pctLeft}%;"></div>
                    <div class="score-bar-fill-r" style="width: ${pctRight}%;"></div>
                </div>
            </div>
        `;
    }

    function showResult(mbtiStr) {
        let char = results[currentLang][mbtiStr];
        let ui = uiStr[currentLang];
        
        // 生成进度条HTML
        let barsHtml = "";
        if (currentLang === 'zh') {
            barsHtml += buildScoreRow('E (外向)', 'I (内向)', scores['E'], scores['I']);
            barsHtml += buildScoreRow('S (实感)', 'N (直觉)', scores['S'], scores['N']);
            barsHtml += buildScoreRow('T (思考)', 'F (情感)', scores['T'], scores['F']);
            barsHtml += buildScoreRow('J (判断)', 'P (感知)', scores['J'], scores['P']);
        } else {
            barsHtml += buildScoreRow('E (Estroverso)', 'I (Introverso)', scores['E'], scores['I']);
            barsHtml += buildScoreRow('S (Sensitivo)', 'N (Intuitivo)', scores['S'], scores['N']);
            barsHtml += buildScoreRow('T (Razionale)', 'F (Emotivo)', scores['T'], scores['F']);
            barsHtml += buildScoreRow('J (Giudicante)', 'P (Percettivo)', scores['J'], scores['P']);
        }
        
        app.innerHTML = `
            <div class="result-header">
                <div class="result-title">${char.name}</div>
                <div class="result-tag">${char.tag}</div>
            </div>
            
            <div class="result-box" style="padding-bottom: 5px;">
                <strong>${ui.dimTitle}</strong>
                <div style="margin-top: 15px;">${barsHtml}</div>
            </div>

            <div class="result-box">
                <strong>${ui.prosTitle}</strong><br>${char.pros}
            </div>
            
            <div class="result-box guide">
                <strong>${ui.consTitle}</strong><br>${char.cons}
            </div>
            
            <div class="match-box match-best">
                <span class="match-title">${ui.bestTitle}</span>
                ${char.best}
            </div>
            <div class="match-box match-learn">
                <span class="match-title">${ui.learnTitle}</span>
                ${char.learn}
            </div>
            
            <button id="action-btn" onclick="resetGame()">${ui.restartBtn}</button>
        `;
    }

    function resetGame() {
        scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        renderLanguageSelect();
    }

    renderLanguageSelect();

</script>
