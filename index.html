<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 灵魂底色测试 - 温和版</title>
    <style>
        :root {
            --primary: #6366F1; /* 柔和的靛蓝色 */
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #334155;
            --bar-bg: #E2E8F0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #app {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }
        h1 { font-size: 24px; margin-bottom: 12px; color: #0F172A; text-align: center; }
        p.desc { color: #64748B; margin-bottom: 25px; line-height: 1.7; font-size: 15px; text-align: center; }
        
        .progress-container { width: 100%; background: var(--bar-bg); border-radius: 10px; height: 8px; margin-bottom: 25px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .option-btn {
            display: block;
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 15px;
            background: var(--card-bg);
            border: 2px solid var(--bar-bg);
            border-radius: 14px;
            font-size: 16px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.5;
        }
        .option-btn:hover { border-color: var(--primary); background: #EEF2FF; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1); }
        
        .result-header { text-align: center; margin-bottom: 20px; }
        .result-title { color: var(--primary); font-size: 36px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
        .result-tag { font-weight: bold; font-size: 18px; color: #10B981; margin-bottom: 20px; }
        
        .result-box { text-align: left; background: #F8FAFC; padding: 20px; border-radius: 16px; margin-bottom: 15px; font-size: 15px; line-height: 1.7; border: 1px solid #E2E8F0; }
        
        /* 改为温暖的成长指南配色 */
        .result-box.guide { background: #ECFDF5; border-color: #A7F3D0; color: #065F46; }
        
        .result-box strong { display: inline-block; margin-bottom: 6px; font-size: 16px; }
        
        .match-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .match-box { flex: 1; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; text-align: center; }
        .match-best { background: #FFF7ED; border: 1px solid #FED7AA; color: #9A3412; }
        .match-worst { background: #F1F5F9; border: 1px solid #CBD5E1; color: #475569; }
        .match-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; display: block;}
        
        #restart-btn { background: var(--primary); color: white; border: none; padding: 16px 28px; border-radius: 14px; cursor: pointer; margin-top: 15px; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.2s; }
        #restart-btn:hover { background: #4F46E5; }
    </style>
</head>
<body>

<div id="app"></div>

        estp: { 
            name: "ESTP 企业家", tag: "【活力四射的实干派，无畏的破局者】", 
            pros: "行动力极强，胆大心细。你能在复杂的环境中迅速捕捉到机遇，极具谈判技巧和人格魅力。你热爱挑战，永远能在现实生活中混得如鱼得水，充满生命力。", 
            cons: "习惯了追求眼前的刺激和短期的收益，有时缺乏对长远未来的深度规划。培养一些耐心和战略眼光，你的才华足以让你在更高、更远的地方闪耀。", 
            bestFriend: "ISTJ (能帮你理清细节、稳固后方的战友)", enemy: "INFJ (试着停下来倾听一下他们深刻的思想)" 
        },
        esfp: { 
            name: "ESFP 表演者", tag: "【闪耀的舞台中心，纯粹的快乐制造机】", 
            pros: "极致的乐天派，充满艺术细胞。只要有你在，空气中都弥漫着快乐的味道。你热情大方，极具感染力，能够轻松化解尴尬，让所有人都享受当下的美好。", 
            cons: "容易被新鲜事物吸引而分散注意力，有时会下意识地逃避深刻或严肃的话题。尝试在享受生活的同时，为自己设定一些长期的小目标，这会让你的快乐更加踏实。", 
            bestFriend: "ISFJ (默默包容并照顾你的温暖港湾)", enemy: "INTP (试着去理解一下他们复杂的逻辑世界)" 
        }
    };

    let app = document.getElementById('app');
    let totalQuestions = questions.length;

    function renderWelcome() {
        app.innerHTML = `
            <div class="result-header">
                <div style="font-size: 55px; margin-bottom: 5px;">🌱</div>
                <h1>MBTI 灵魂底色测试</h1>
                <p class="desc">不用做一百道题，最快 1.5 分钟直击内心。<br>带你发现属于你的闪光点与成长之力。</p>
            </div>
            <button id="restart-btn" onclick="renderQuestion(0)">开启自我探索</button>
        `;
    }

    function renderQuestion(index) {
        if (index >= totalQuestions) {
            calculateResult();
            return;
        }
        
        let progress = (index / totalQuestions) * 100;
        let q = questions[index];
        let html = `
            <div class="progress-container" style="display: block;">
                <div class="progress-bar" style="width: ${progress}%"></div>
            </div>
            <h1 style="text-align: left; font-size: 20px;">Q${index + 1}/${totalQuestions}</h1>
            <p class="desc" style="text-align: left; font-size: 16px; color:#334155;">${q.q}</p>
        `;
        
        q.opts.forEach((opt) => {
            html += `<button class="option-btn" onclick="handleAnswer('${opt.type}', ${index})">${opt.text}</button>`;
        });
        app.innerHTML = html;
    }

    function handleAnswer(type, index) {
        scores[type]++;
        renderQuestion(index + 1);
    }

    function calculateResult() {
        let result = "";
        result += scores['E'] >= scores['I'] ? 'e' : 'i';
        result += scores['S'] >= scores['N'] ? 's' : 'n';
        result += scores['T'] >= scores['F'] ? 't' : 'f';
        result += scores['J'] >= scores['P'] ? 'j' : 'p';
        
        showResult(result);
    }

    function showResult(mbtiStr) {
        let char = mbtiData[mbtiStr];
        app.innerHTML = `
            <div class="result-header">
                <div class="result-title">${char.name}</div>
                <div class="result-tag">${char.tag}</div>
            </div>
            
            <div class="result-box">
                <strong>✨ 你的发光点：</strong><br>${char.pros}
            </div>
            
            <div class="result-box guide">
                <strong>🌱 成长的温柔建议：</strong><br>${char.cons}
            </div>
            
            <div class="match-container">
                <div class="match-box match-best">
                    <span class="match-title">🤝 相互成就的搭档</span>
                    ${char.bestFriend}
                </div>
                <div class="match-box match-worst">
                    <span class="match-title">💡 值得学习的互补</span>
                    ${char.enemy}
                </div>
            </div>
            
            <button id="restart-btn" onclick="resetGame()">再次测试</button>
        `;
    }

    function resetGame() {
        scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        renderWelcome();
    }

    renderWelcome();

</script>
</body>
</html>
